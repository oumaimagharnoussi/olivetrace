# Base MySQL 8 pour le développement local.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olivetrace
      MYSQL_USER: olivetrace
      MYSQL_PASSWORD: olivetrace
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro

volumes:
  mysql-data:
